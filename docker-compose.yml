services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailgate
      POSTGRES_PASSWORD: mailgate
      POSTGRES_DB: mailgate
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailgate -d mailgate"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]
  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://mailgate:mailgate@postgres:5432/mailgate
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mailgate:mailgate@postgres:5432/mailgate
      PORT: "3000"
    ports: ["${API_PORT:-3000}:3000"]
    stop_grace_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  pgdata: {}
